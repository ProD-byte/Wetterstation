; LILYGO T-Display-S3 (ESP32-S3, 1,9" 320 x 170) - Wetterstation
; Infos und Pins: INFO.md
; WLAN wird per Handy eingerichtet (WLAN "Wetterstation-Setup").
; geheim.ini (Vorlage: geheim.beispiel.ini) enthaelt nur das Passwort fuer Updates ueber WLAN.

[platformio]
extra_configs = geheim.ini
default_envs = tdisplay_s3

[env:tdisplay_s3]
; Arduino-Kern 2.0.14: TFT_eSPI laeuft auf dem T-Display-S3 (8-Bit-Parallelbus) nicht mit Kern 3.x,
; siehe https://github.com/Xinyuan-LilyGO/T-Display-S3 (Known Issues)
platform = platformio/espressif32 @ 6.5.0
board = lilygo-t-display-s3
framework = arduino

; 16 MB Flash: zwei Programmplaetze mit je 6,5 MB (Updates ueber WLAN und aus dem Internet)
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/PNGdec@^1.0.3   ; Radar- und Kartenbilder entpacken

build_flags =
    -DBOARD_HAS_PSRAM
    ; Display-Einstellungen fuer TFT_eSPI direkt hier, statt in der Bibliothek etwas zu aendern
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel). In VS Code unten in der blauen Leiste
; die Umgebung "env:tdisplay_s3_wlan" auswaehlen, dann wie gewohnt Upload (->).
; Das allererste Mal muss per USB-Kabel hochgeladen werden.
; Klappt "wetterstation.local" nicht, hier die IP-Adresse eintragen.
; ------------------------------------------------------------
[env:tdisplay_s3_wlan]
extends = env:tdisplay_s3
upload_protocol = espota
upload_port = wetterstation.local
upload_flags =
    --auth=${geheim.ota_passwort}
