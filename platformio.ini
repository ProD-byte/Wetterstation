; TTGO T-Display (ESP32) - Wetterstation Cottbus
; Infos und Pins: INFO.md
; WLAN wird per Handy eingerichtet (WLAN "Wetterstation-Setup").
; geheim.ini (Vorlage: geheim.beispiel.ini) enthaelt nur das Passwort fuer Updates ueber WLAN.

[platformio]
extra_configs = geheim.ini

[env:tdisplay]
platform = platformio/espressif32 @ 8.0.0   ; gleiche Version wie beim Roboauto (ist schon installiert)
board = lilygo-t-display
framework = arduino

; 4 MB Flash laut Shop
board_upload.flash_size = 4MB
; Zwei Programmplaetze mit je 1,9 MB fuer Updates ueber WLAN (wie beim Roboauto).
; Die normalen 1,25 MB reichen fuer WLAN + HTTPS + Schriften nicht.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
; Ohne diese zwei Zeilen kann der Monitor den ESP32 resetten oder in den Download-Modus schicken
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    ; Display-Einstellungen fuer TFT_eSPI direkt hier, statt in der Bibliothek etwas zu aendern
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel). In VS Code unten in der blauen Leiste
; die Umgebung "env:tdisplay_wlan" auswaehlen, dann wie gewohnt Upload (->).
; Das allererste Mal muss per USB-Kabel hochgeladen werden.
; Klappt "wetterstation.local" nicht, hier die IP-Adresse eintragen.
; ------------------------------------------------------------
[env:tdisplay_wlan]
extends = env:tdisplay
upload_protocol = espota
upload_port = wetterstation.local
upload_flags =
    --auth=${geheim.ota_passwort}
